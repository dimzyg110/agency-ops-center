# ZeroClaw - Roviq Agency Operations

[core]
name = "zeroclaw-roviq"
log_level = "info"

[provider]
provider = "openrouter"
model = "anthropic/claude-3-haiku"
api_key = "${OPENROUTER_API_KEY}"

[memory]
type = "sqlite"
path = "/data/memory.db"

[channels]
discord = true

[channels_config.discord]
token = "${DISCORD_TOKEN_ROVIQ}"
allowed_users = ["*"]

[tools]
# Webhook for bot-bus communication
webhook_url = "${BOT_BUS_URL}"
