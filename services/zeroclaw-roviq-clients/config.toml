# ZeroClaw - Roviq Client-Facing Agent

default_provider = "openrouter"
default_model = "anthropic/claude-3-haiku"
api_key = "sk-placeholder"

[observability]
backend = "none"

[autonomy]
level = "supervised"
workspace_only = true
allowed_commands = ["git", "npm", "cargo", "ls", "cat", "grep", "find", "echo", "pwd", "wc", "head", "tail"]
forbidden_paths = ["/etc", "/root", "/home", "/usr", "/bin", "/sbin", "/lib", "/opt", "/boot", "/dev", "/proc", "/sys", "/var", "/tmp", "~/.ssh", "~/.gnupg", "~/.aws", "~/.config"]
max_actions_per_hour = 20
max_cost_per_day_cents = 500
require_approval_for_medium_risk = true
block_high_risk_commands = true

[runtime]
kind = "native"

[heartbeat]
enabled = false
interval_minutes = 30

[channels_config]
cli = true

[memory]
backend = "sqlite"
auto_save = true
embedding_provider = "none"

[tunnel]
provider = "none"

[gateway]
host = "127.0.0.1"
port = 8080
require_pairing = true
allow_public_bind = true
pair_rate_limit_per_minute = 10
webhook_rate_limit_per_minute = 60

[secrets]
encrypt = true

[browser]
enabled = false

[identity]
format = "openclaw"
