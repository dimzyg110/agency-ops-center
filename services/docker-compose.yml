# Docker Compose - All Services
# Run: docker compose -f services/docker-compose.yml up -d

services:
  # Bot Bus - Message relay for inter-agent communication
  bot-bus:
    build: ./bot-bus
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    restart: unless-stopped

  # ZeroClaw Agents
  zeroclaw-roviq:
    build: ./zeroclaw-roviq
    env_file:
      - ../.env
    environment:
      BUS_SUBSCRIBE_ENABLED: "true"
      BUS_URL: "http://bot-bus:3000"
      BUS_BOT_NAME: "zeroclaw-roviq"
    volumes:
      - ../data/zeroclaw-roviq:/data
    restart: unless-stopped

  zeroclaw-glass:
    build: ./zeroclaw-glass
    env_file:
      - ../.env
    environment:
      BUS_SUBSCRIBE_ENABLED: "true"
      BUS_URL: "http://bot-bus:3000"
      BUS_BOT_NAME: "zeroclaw-glass"
    volumes:
      - ../data/zeroclaw-glass:/data
    restart: unless-stopped

  zeroclaw-roviq-clients:
    build: ./zeroclaw-roviq-clients
    env_file:
      - ../.env
    environment:
      BUS_SUBSCRIBE_ENABLED: "true"
      BUS_URL: "http://bot-bus:3000"
      BUS_BOT_NAME: "zeroclaw-roviq-clients"
    volumes:
      - ../data/zeroclaw-roviq-clients:/data
    restart: unless-stopped
