# ZeroClaw Configuration Template
# Copy this folder and rename for your agent

[core]
# CHANGE THIS - unique name for this agent
name = "zeroclaw-template"
log_level = "info"

[provider]
# Add your provider config
# provider = "openrouter"
# model = "anthropic/claude-3-haiku"
